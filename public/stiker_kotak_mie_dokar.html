<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Stiker Kotak Barcode Web - Mie Reshik Cap Dokar</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');

    @page {
      size: 80mm 80mm;
      margin: 0;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 1600px;
      height: 1600px;
      overflow: hidden;
      background-color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #071F14;
    }

    .sticker-canvas {
      width: 1600px;
      height: 1600px;
      position: relative;
      background: #FFFFFF;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 16px;
      overflow: hidden;
    }

    /* Die-cut outer border hugging the sticker edge */
    .sticker-border {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      bottom: 14px;
      border: 4.5px solid #145937;
      border-radius: 46px;
      pointer-events: none;
    }

    /* ============================================================
       TOP BRAND HEADER (With OLAHAN SINGKONG ALAMI pill)
       ============================================================ */
    .brand-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 5;
      width: 100%;
    }

    .top-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 36px;
      border-radius: 999px;
      background: #FDF6E2;
      border: 2px solid #E6A820;
      color: #B37D0B;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 4px 12px rgba(230, 168, 32, 0.15);
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      width: 100%;
    }
    .brand-logo {
      width: 145px;
      height: 145px;
      border-radius: 50%;
      border: 4.5px solid #145937;
      background: #FFFFFF;
      padding: 6px;
      box-shadow: 0 8px 24px rgba(20, 89, 55, 0.18);
      flex-shrink: 0;
    }
    .brand-title {
      font-size: 84px;
      font-weight: 900;
      line-height: 1;
      color: #071F14;
      letter-spacing: -1.5px;
    }
    .brand-title span {
      color: #145937;
    }

    .brand-slogan {
      font-size: 32px;
      font-weight: 800;
      color: #B37D0B;
      letter-spacing: 0.8px;
    }

    /* ============================================================
       CENTER QR CARD (Tightly spaced under brand slogan)
       ============================================================ */
    .qr-card-container {
      z-index: 5;
      background: #F4F9F5;
      border: 4px solid #145937;
      border-radius: 42px;
      padding: 22px 30px 24px;
      box-shadow: 0 16px 38px rgba(20, 89, 55, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 1520px;
    }

    .qr-cta-badge {
      background: #145937;
      color: #FFFFFF;
      padding: 12px 56px;
      border-radius: 999px;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 6px 18px rgba(20, 89, 55, 0.3);
    }
    .qr-cta-badge span.camera-icon {
      color: #F5B838;
      font-size: 36px;
    }

    .qr-frame {
      position: relative;
      width: 1020px;
      height: 1020px;
      background: #FFFFFF;
      border-radius: 30px;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    .bracket {
      position: absolute;
      width: 56px;
      height: 56px;
      border-color: #145937;
      border-style: solid;
      pointer-events: none;
    }
    .bracket-tl { top: 12px; left: 12px; border-width: 8px 0 0 8px; border-top-left-radius: 16px; }
    .bracket-tr { top: 12px; right: 12px; border-width: 8px 8px 0 0; border-top-right-radius: 16px; }
    .bracket-bl { bottom: 12px; left: 12px; border-width: 0 0 8px 8px; border-bottom-left-radius: 16px; }
    .bracket-br { bottom: 12px; right: 12px; border-width: 0 8px 8px 0; border-bottom-right-radius: 16px; }

    .qr-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
