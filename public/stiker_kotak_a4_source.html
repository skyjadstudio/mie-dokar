  <title>Lembar Cetak A4 Stiker Kotak Mie Dokar (6x)</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 0;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 210mm;
      height: 297mm;
      background: #FFFFFF;
      margin: 0;
      padding: 15mm 18mm;
      display: flex;
      flex-direction: column;
      align-items: center;

      font-size: 8pt;
      color: #145937;
      font-weight: 700;
    }
    .stickers-grid {
      width: 174mm;
      height: 255mm;
      display: grid;
      grid-template-columns: 80mm 80mm;
      grid-template-rows: 80mm 80mm 80mm;
      column-gap: 14mm;
      row-gap: 7.5mm;
      justify-content: center;
      align-content: center;
    }
    .sticker-unit {
      width: 80mm;
      height: 80mm;
      position: relative;
    }
    .sticker-unit img {
      width: 80mm;
      height: 80mm;
      display: block;
      object-fit: cover;
    }
    .sheet-footer {
      width: 100%;
      text-align: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 7.5pt;
      color: #666666;
